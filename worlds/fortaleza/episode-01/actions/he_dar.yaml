# GIVE actions — player gives items to trolls
# FLAG marks troll as happy, TRANSFER removes item from inventory

- hyper_edge_id: "he_dar_cigarro_llamador"
  name: "Dar cigarro al llamador de bronce"
  priority: 10
  clique:
    subject: "player"
    verb: "dar"
    target: "llamador_bronce"
    instrument: "cigarro"
  operators:
    - type: "TRANSFER"
      entity: "cigarro"
      from_container: "hero"
      to_container: null
    - type: "FLAG"
      flag: "llamador_happy"
      value: true
  output: "El llamador sonríe. '¡Por fin! Toma esto.'"

