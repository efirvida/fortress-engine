# KILL actions — player kills guards/trolls with specific weapons
# FLAG marks entity as dead

- hyper_edge_id: "he_matar_ciclope"
  name: "Matar al Cíclope"
  priority: 10
  clique:
    subject: "player"
    verb: "matar"
    target: "ciclope"
    instrument: "maza"
  operators:
    - type: "FLAG"
      flag: "ciclope_muerto"
      value: true
  output: "¡Arrrggghhhh! El Cíclope cae. Revela una contraseña."

