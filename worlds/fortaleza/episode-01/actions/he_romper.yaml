# BREAK actions — player breaks hidden objects with tools
# TRANSFORM changes component values (hidden → broken)

- hyper_edge_id: "he_romper_monolito"
  name: "Romper el monolito de mármol"
  priority: 10
  clique:
    subject: "player"
    verb: "romper"
    target: "monolito_marmol"
    instrument: "maza"
  operators:
    - type: "TRANSFORM"
      entity: "monolito_marmol"
      component: "broken"
      old_value: false
      new_value: true
    - type: "FLAG"
      flag: "monolito_roto"
      value: true
  output: "El monolito se rompe revelando un trébol."

