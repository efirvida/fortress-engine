# TAKE actions — player picks up items from rooms
# TRANSFER moves entity from room to hero inventory

- hyper_edge_id: "he_tomar_roble"
  name: "Tomar el roble"
  priority: 10
  clique:
    subject: "player"
    verb: "tomar"
    target: "roble"
  operators:
    - type: "TRANSFORM"
      entity: "roble"
      component: "visited"
      old_value: false
      new_value: true
  output: "Examinas el roble. Tiene una inscripción."

