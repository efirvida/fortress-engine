# GIVE actions (episode 2) — player gives the wanted item to each troll
# TRANSFER sends the item to limbo, FLAG marks the troll as satisfied

- hyper_edge_id: "he_dar_botella_de_vino_camello"
  name: "Dar botella de vino a camello"
  priority: 10
  clique:
    subject: "player"
    verb: "dar"
    target: "camello"
    instrument: "botella_de_vino"
  operators:
    - type: "TRANSFER"
      entity: "botella_de_vino"
      from_container: "hero"
      to_container: null
    - type: "FLAG"
      flag: "camello_happy"
      value: true
  output: "El camello bebe el vino de un trago y resopla satisfecho. Ya no te cierra el paso."

