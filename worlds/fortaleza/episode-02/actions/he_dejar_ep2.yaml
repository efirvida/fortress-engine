# DROP actions (episode 2) — generic, works for any carried item

- hyper_edge_id: "he_dejar_item_ep2"
  name: "Dejar un objeto"
  priority: 0
  clique:
    subject: "player"
    verb: "dejar"
    target: "*"
  operators: []
  output: "Dejas el objeto en el suelo."

- hyper_edge_id: "he_dejar_nada_ep2"
  name: "Dejar sin objeto indicado"
  priority: 0
  clique:
    subject: "player"
    verb: "dejar"
    target: null
  operators: []
  output: "¿Qué quieres dejar?"

- hyper_edge_id: "he_dejar_todo_ep2"
  name: "Dejar todo el inventario"
  priority: 1
  clique:
    subject: "player"
    verb: "dejar"
    target: "todo"
  operators: []
  output: "Vacías tus manos. Todo queda en el suelo."

# --- Ritual drops: each sacred object must be placed in its goal room.
# The generic drop above carries no operators, so the ritual placements are
# modeled as explicit hyper edges that TRANSFER the object from the hero's
# inventory to the goal anchor (faithful to the original walkthrough steps
# 66-73 and the episode-02 goal conditions).

- hyper_edge_id: "he_dejar_antorcha_subterraneos"
  name: "Dejar la antorcha en la habitación de huéspedes"
  priority: 5
  clique:
    subject: "player"
    verb: "dejar"
    target: "antorcha_subterraneos"
  operators:
    - type: "TRANSFER"
      entity: "antorcha_subterraneos"
      from_container: "hero"
      to_container: "habitacion_para_huespedes"
  output: "Dejas la antorcha en la habitación de huéspedes."

