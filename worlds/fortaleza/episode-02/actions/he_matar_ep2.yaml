  output: "El Inmortal lo mira agradecido y le dice antes de morir:\n\"No confundas la tercera muralla con la tercera barrera que tienes que romper. La tercera barrera está en tí mismo.\""

- hyper_edge_id: "he_matar_ogro"
  name: "Matar a ogro"
  priority: 10
  clique:
    subject: "player"
    verb: "matar"
    target: "ogro"
    instrument: "cubo_de_agua"
  operators:
    - type: "FLAG"
      flag: "ogro_muerto"
      value: true
  output: "El Ogro despierta sobresaltado. El agua lo quema como si fuese ácido. Antes de volverse un charco de pasta pestilente le grita, víctima de un rencor casi infantil:\n\"¡No saldrás del lago con Marmidosa tan fácilmente!\"\nEl cubo de agua vuelve a llenarse."

