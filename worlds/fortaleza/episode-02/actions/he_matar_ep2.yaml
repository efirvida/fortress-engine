# KILL actions (episode 2) — each guard dies only to its lethal weapon

- hyper_edge_id: "he_matar_carcelero"
  name: "Matar a carcelero"
  priority: 10
  clique:
    subject: "player"
    verb: "matar"
    target: "carcelero"
    instrument: "marmidosa"
  operators:
    - type: "FLAG"
      flag: "carcelero_muerto"
      value: true
  output: "ARRRGG!!! ¡Te será muy difícil abrir la celda, porque la palabra mágica es el nombre de la primera criatura que viste al salir del cuarto de huéspedes! \nUsted sonríe porque sabe que el problema es fácil."

- hyper_edge_id: "he_matar_grifo"
  name: "Matar a grifo"
  priority: 10
  clique:
    subject: "player"
    verb: "matar"
    target: "grifo"
    instrument: "daga_dragon"
  operators:
    - type: "FLAG"
      flag: "grifo_muerto"
      value: true
  output: "El grifo se contorsiona tratando de arrancarse la daga y grita: \"¡Aura!\"."

- hyper_edge_id: "he_matar_hija_del_hechicero"
  name: "Matar a hija del hechicero"
  priority: 10
  clique:
    subject: "player"
    verb: "matar"
    target: "hija_del_hechicero"
    instrument: "aguja_plata"
  operators:
