      flag: "hija_muerta"
      value: true
  output: "Usted clava fuertemente la aguja entre las escamas. Las cabezas le miran llenas de ira y hay una que exclama: \"¡Mata a todos los que te mintieron si quieres salir!\""

- hyper_edge_id: "he_matar_inmortal"
  name: "Matar a inmortal"
  priority: 10
  clique:
    subject: "player"
    verb: "matar"
    target: "inmortal"
    instrument: "arco_inmortal"
  operators:
