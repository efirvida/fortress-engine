# KILL actions (episode 2) — each guard dies only to its lethal weapon

- hyper_edge_id: "he_matar_carcelero"
  name: "Matar a carcelero"
  priority: 10
  clique:
    subject: "player"
    verb: "matar"
    target: "carcelero"
    instrument: "marmidosa"
  operators:
    - type: "FLAG"
      flag: "carcelero_muerto"
      value: true
  output: "Marmidosa atraviesa al carcelero. Las llaves de las celdas caen al suelo."

