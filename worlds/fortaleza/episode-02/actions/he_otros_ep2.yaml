# SYSTEM actions (episode 2) — inventory, quit, weigh, answer, ask

- hyper_edge_id: "he_inventario_ep2"
  name: "Ver inventario"
  priority: 0
  clique:
    subject: "player"
    verb: "inventario"
    target: "*"
  operators: []
  output: ""

- hyper_edge_id: "he_abandonar_ep2"
